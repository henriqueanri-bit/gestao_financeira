    <script>
        // ================== ESTADO GLOBAL ==================
        let companies = [];          // [{id, name}]
        let currentCompanyId = null; // empresa selecionada
        let transactions = [];       // todas da empresa atual
        let filteredTransactions = [];
        let editingTransactionId = null;

        // ================== FUNÇÕES UTILITÁRIAS ==================
        function formatCurrency(value) {
            return value.toLocaleString('pt-BR', {
                style: 'currency',
                currency: 'BRL'
            });
        }

        function showAlert(message, type = 'success', duration = 3000) {
            const container = document.getElementById('alertContainer');
            const alert = document.createElement('div');
            alert.classList.add('alert');
            if (type === 'success') alert.classList.add('alert-success');
            else if (type === 'error') alert.classList.add('alert-error');
            else if (type === 'warning') alert.classList.add('alert-warning');

            alert.textContent = message;
            container.appendChild(alert);

            setTimeout(() => {
                alert.remove();
            }, duration);
        }

        function getCompanyStorageKey(companyId) {
            return `transactions_${companyId}`;
        }

        // ================== EMPRESAS (LOCALSTORAGE) ==================
        function loadCompanies() {
            const stored = localStorage.getItem('companies');
            if (stored) {
                companies = JSON.parse(stored);
            } else {
                // cria uma empresa padrão
                const defaultCompany = { id: Date.now().toString(), name: 'Minha Empresa' };
                companies = [defaultCompany];
                localStorage.setItem('companies', JSON.stringify(companies));
            }

            const storedCurrent = localStorage.getItem('currentCompanyId');
            if (storedCurrent && companies.find(c => c.id === storedCurrent)) {
                currentCompanyId = storedCurrent;
            } else {
                currentCompanyId = companies[0].id;
                localStorage.setItem('currentCompanyId', currentCompanyId);
            }

            renderCompanySelector();
            loadTransactions();
        }

        function saveCompanies() {
            localStorage.setItem('companies', JSON.stringify(companies));
            localStorage.setItem('currentCompanyId', currentCompanyId);
        }

        function renderCompanySelector() {
            const select = document.getElementById('currentCompany');
            select.innerHTML = '';
            companies.forEach(company => {
                const opt = document.createElement('option');
                opt.value = company.id;
                opt.textContent = company.name;
                if (company.id === currentCompanyId) opt.selected = true;
                select.appendChild(opt);
            });

            select.onchange = () => {
                currentCompanyId = select.value;
                saveCompanies();
                loadTransactions();
            };
        }

        function addCompany() {
            const name = prompt('Nome da nova empresa:');
            if (!name) return;
            const newCompany = { id: Date.now().toString(), name: name.trim() };
            companies.push(newCompany);
            currentCompanyId = newCompany.id;
            saveCompanies();
            renderCompanySelector();
            loadTransactions();
            showAlert('Nova empresa criada.', 'success');
        }

        // ================== TRANSAÇÕES (LOCALSTORAGE) ==================
        function loadTransactions() {
            if (!currentCompanyId) return;
            const key = getCompanyStorageKey(currentCompanyId);
            const stored = localStorage.getItem(key);
            transactions = stored ? JSON.parse(stored) : [];
            filteredTransactions = [];
            renderTransactions();
            updateSummary();
        }

        function saveTransactions() {
            if (!currentCompanyId) return;
            const key = getCompanyStorageKey(currentCompanyId);
            localStorage.setItem(key, JSON.stringify(transactions));
        }

        // ================== RENDERIZAÇÃO TABELA E RESUMO ==================
        function renderTransactions() {
            const tbody = document.getElementById('transactionsBody');
            tbody.innerHTML = '';

            const data = filteredTransactions.length > 0 ? filteredTransactions : transactions;

            if (data.length === 0) {
                const tr = document.createElement('tr');
                const td = document.createElement('td');
                td.colSpan = 9;
                td.className = 'empty-state';
                td.textContent = 'Nenhuma transação registrada.';
                tr.appendChild(td);
                tbody.appendChild(tr);
                return;
            }

            data.forEach(t => {
                const tr = document.createElement('tr');

                const tdDate = document.createElement('td');
                tdDate.textContent = new Date(t.date + 'T00:00:00').toLocaleDateString('pt-BR');
                tr.appendChild(tdDate);

                const tdType = document.createElement('td');
                const spanType = document.createElement('span');
                spanType.className = 'tag ' + (t.type === 'entrada' ? 'income' : 'expense');
                spanType.textContent = t.type === 'entrada' ? 'Entrada' : 'Saída';
                tdType.appendChild(spanType);
                tr.appendChild(tdType);

                const tdDesc = document.createElement('td');
                tdDesc.textContent = t.description;
                tr.appendChild(tdDesc);

                const tdQty = document.createElement('td');
                tdQty.textContent = t.quantity;
                tr.appendChild(tdQty);

                const tdValue = document.createElement('td');
                tdValue.textContent = formatCurrency(t.value);
                tr.appendChild(tdValue);

                const tdTotal = document.createElement('td');
                const signedTotal = t.type === 'saida' ? -t.totalAbs : t.totalAbs;
                tdTotal.textContent = formatCurrency(signedTotal);
                tr.appendChild(tdTotal);

                const tdResp = document.createElement('td');
                tdResp.textContent = t.responsible || '-';
                tr.appendChild(tdResp);

                const tdPayment = document.createElement('td');
                const parts = [];
                if (t.paymentDetails) {
                    for (const method in t.paymentDetails) {
                        const val = t.paymentDetails[method];
                        if (val > 0) parts.push(`${method}: ${formatCurrency(val)}`);
                    }
                }
                tdPayment.textContent = parts.join(' | ') || '-';
                tr.appendChild(tdPayment);

                const tdActions = document.createElement('td');
                const btnEdit = document.createElement('button');
                btnEdit.className = 'btn-action';
                btnEdit.textContent = 'Editar';
                btnEdit.onclick = () => editTransaction(t.id);
                tdActions.appendChild(btnEdit);

                const btnDelete = document.createElement('button');
                btnDelete.className = 'btn-action btn-delete';
                btnDelete.textContent = 'Excluir';
                btnDelete.onclick = () => deleteTransaction(t.id);
                tdActions.appendChild(btnDelete);

                tr.appendChild(tdActions);

                tbody.appendChild(tr);
            });
        }

        function updateSummary() {
            const data = filteredTransactions.length > 0 ? filteredTransactions : transactions;

            let totalEntrada = 0;
            let totalSaida = 0;

            const paymentTotals = {
                'Dinheiro': 0,
                'Pix': 0,
                'Cartão Débito': 0,
                'Cartão Crédito': 0
            };

            data.forEach(t => {
                if (t.type === 'entrada') {
                    totalEntrada += t.totalAbs;
                } else {
                    totalSaida += t.totalAbs;
                }

                if (t.paymentDetails) {
                    for (const method in t.paymentDetails) {
                        if (!paymentTotals.hasOwnProperty(method)) continue;
                        paymentTotals[method] += t.paymentDetails[method];
                    }
                }
            });

            document.getElementById('totalEntrada').textContent = formatCurrency(totalEntrada);
            document.getElementById('totalSaida').textContent = formatCurrency(totalSaida);
            document.getElementById('saldoLiquido').textContent = formatCurrency(totalEntrada - totalSaida);

            document.getElementById('totalDinheiro').textContent = formatCurrency(paymentTotals['Dinheiro']);
            document.getElementById('totalPix').textContent = formatCurrency(paymentTotals['Pix']);
            document.getElementById('totalDebito').textContent = formatCurrency(paymentTotals['Cartão Débito']);
            document.getElementById('totalCredito').textContent = formatCurrency(paymentTotals['Cartão Crédito']);
        }

        // ================== FILTROS ==================
        function applyFilters() {
            const start = document.getElementById('filterDateStart').value;
            const end = document.getElementById('filterDateEnd').value;

            if (!start && !end) {
                filteredTransactions = [];
                renderTransactions();
                updateSummary();
                return;
            }

            filteredTransactions = transactions.filter(t => {
                if (start && t.date < start) return false;
                if (end && t.date > end) return false;
                return true;
            });

            renderTransactions();
            updateSummary();
        }

        function clearFilters() {
            document.getElementById('filterDateStart').value = '';
            document.getElementById('filterDateEnd').value = '';
            filteredTransactions = [];
            renderTransactions();
            updateSummary();
        }

        // ================== FORMULÁRIO ==================
        const paymentMethodCheckboxes = [];
        const paymentValueInputs = {};

        function initPaymentControls() {
            document.querySelectorAll('input[name="paymentMethodCheck"]').forEach(cb => {
                paymentMethodCheckboxes.push(cb);
            });
            document.querySelectorAll('[data-payment-input]').forEach(input => {
                const method = input.getAttribute('data-payment-input');
                paymentValueInputs[method] = input;
            });

            paymentMethodCheckboxes.forEach(checkbox => {
                checkbox.addEventListener('change', (e) => {
                    const method = e.target.value;
                    const input = paymentValueInputs[method];
                    if (!input) return;
                    if (checkbox.checked) {
                        input.disabled = false;
                        if (parseFloat(input.value) === 0) {
                            input.value = '0.00';
                        }
                    } else {
                        input.disabled = true;
                        input.value = '0.00';
                    }
                });
            });
        }

        function resetForm() {
            const form = document.getElementById('transactionForm');
            form.reset();
            document.getElementById('transactionId').value = '';
            document.getElementById('date').valueAsDate = new Date();

            paymentMethodCheckboxes.forEach(cb => {
                cb.checked = false;
                const input = paymentValueInputs[cb.value];
                if (input) {
                    input.value = '0.00';
                    input.disabled = true;
                }
            });

            editingTransactionId = null;
            document.getElementById('formTitle').textContent = 'Nova transação';
            document.getElementById('submitButton').textContent = 'Salvar transação';
            document.getElementById('cancelEditButton').style.display = 'none';
        }

        function editTransaction(id) {
            const t = transactions.find(tr => tr.id === id);
            if (!t) return;

            document.getElementById('transactionId').value = t.id;
            document.getElementById('date').value = t.date;
            document.getElementById('type').value = t.type;
            document.getElementById('description').value = t.description;
            document.getElementById('quantity').value = t.quantity;
            document.getElementById('value').value = t.value;
            document.getElementById('responsible').value = t.responsible || '';
            document.getElementById('notes').value = t.notes || '';

            paymentMethodCheckboxes.forEach(cb => {
                cb.checked = false;
                const input = paymentValueInputs[cb.value];
                if (input) {
                    input.value = '0.00';
                    input.disabled = true;
                }
            });

            if (t.paymentDetails) {
                for (const method in t.paymentDetails) {
                    const cb = paymentMethodCheckboxes.find(c => c.value === method);
                    const input = paymentValueInputs[method];
                    if (cb && input) {
                        cb.checked = true;
                        input.disabled = false;
                        input.value = t.paymentDetails[method].toFixed(2);
                    }
                }
            }

            editingTransactionId = id;
            document.getElementById('formTitle').textContent = 'Editar transação';
            document.getElementById('submitButton').textContent = 'Atualizar transação';
            document.getElementById('cancelEditButton').style.display = 'block';

            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function deleteTransaction(id) {
            if (!confirm('Tem certeza que deseja excluir esta transação?')) return;
            transactions = transactions.filter(t => t.id !== id);
            saveTransactions();
            applyFilters();
            showAlert('Transação excluída.', 'success');
        }

        // ================== BACKUP / EXPORT ==================
        function exportDataJson() {
            if (!currentCompanyId) {
                showAlert('Nenhuma empresa selecionada.', 'warning');
                return;
            }
            const dataToExport = transactions;
            if (dataToExport.length === 0) {
                showAlert('Não há dados para backup.', 'warning');
                return;
            }

            const blob = new Blob([JSON.stringify(dataToExport, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            const companyName = companies.find(c => c.id === currentCompanyId)?.name || 'empresa';
            a.href = url;
            a.download = `backup_${companyName}_${new Date().toISOString().slice(0,10)}.json`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
            showAlert('Backup JSON gerado.', 'success');
        }

        function importDataJson() {
            if (!currentCompanyId) {
                showAlert('Nenhuma empresa selecionada.', 'warning');
                return;
            }
            const input = document.createElement('input');
            input.type = 'file';
            input.accept = 'application/json';
            input.onchange = e => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = ev => {
                    try {
                        const imported = JSON.parse(ev.target.result);
                        if (!Array.isArray(imported)) throw new Error('Formato inválido');
                        if (!confirm('Isso vai substituir todas as transações atuais desta empresa. Continuar?')) return;
                        transactions = imported;
                        saveTransactions();
                        filteredTransactions = [];
                        renderTransactions();
                        updateSummary();
                        showAlert('Backup importado com sucesso.', 'success');
                    } catch (err) {
                        console.error(err);
                        showAlert('Erro ao importar backup JSON.', 'error');
                    }
                };
                reader.readAsText(file);
            };
            input.click();
        }

        function exportToCsv() {
            const data = filteredTransactions.length > 0 ? filteredTransactions : transactions;
            if (data.length === 0) {
                showAlert('Não há dados para exportar.', 'warning');
                return;
            }

            let csv = '';
            const headers = [
                'Data','Tipo','Descrição','Quantidade','Valor Unitário','Total','Responsável',
                'Dinheiro','Pix','Cartão Débito','Cartão Crédito','Observações'
            ];
            csv += headers.join(';') + '\r\n';

            data.forEach(t => {
                const row = [
                    new Date(t.date + 'T00:00:00').toLocaleDateString('pt-BR'),
                    t.type === 'entrada' ? 'Entrada' : 'Saída',
                    `"${(t.description || '').replace(/"/g,'""')}"`,
                    String(t.quantity).replace('.', ','),
                    t.value.toFixed(2).replace('.', ','),
                    (t.totalAbs * (t.type === 'saida' ? -1 : 1)).toFixed(2).replace('.', ','),
                    `"${(t.responsible || '').replace(/"/g,'""')}"`,
                    (t.paymentDetails?.['Dinheiro'] || 0).toFixed(2).replace('.', ','),
                    (t.paymentDetails?.['Pix'] || 0).toFixed(2).replace('.', ','),
                    (t.paymentDetails?.['Cartão Débito'] || 0).toFixed(2).replace('.', ','),
                    (t.paymentDetails?.['Cartão Crédito'] || 0).toFixed(2).replace('.', ','),
                    `"${(t.notes || '').replace(/"/g,'""')}"`
                ];
                csv += row.join(';') + '\r\n';
            });

            const blob = new Blob(["\uFEFF" + csv], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            const companyName = companies.find(c => c.id === currentCompanyId)?.name || 'empresa';
            a.href = url;
            a.download = `extrato_${companyName}_${new Date().toISOString().slice(0,10)}.csv`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
            showAlert('CSV exportado.', 'success');
        }

        function printReport() {
            window.print();
        }

        // ================== INICIALIZAÇÃO ==================
        document.addEventListener('DOMContentLoaded', () => {
            // Datas topo
            const now = new Date();
            const todayText = now.toLocaleDateString('pt-BR', {
                weekday: 'short', day: '2-digit', month: '2-digit', year: 'numeric'
            });
            document.getElementById('todayLabel').textContent = todayText;
            document.getElementById('todayLabelHeader').textContent = todayText;

            document.getElementById('date').valueAsDate = now;

            // Eventos botões topo
            document.getElementById('addCompanyBtn').addEventListener('click', addCompany);
            document.getElementById('applyFilterBtn').addEventListener('click', applyFilters);
            document.getElementById('clearFilterBtn').addEventListener('click', clearFilters);
            document.getElementById('backupJsonBtn').addEventListener('click', exportDataJson);
            document.getElementById('restoreJsonBtn').addEventListener('click', importDataJson);
            document.getElementById('exportCsvBtn').addEventListener('click', exportToCsv);
            document.getElementById('printBtn').addEventListener('click', printReport);
            document.getElementById('cancelEditButton').addEventListener('click', resetForm);

            initPaymentControls();
            loadCompanies();

            // Submit form
            document.getElementById('transactionForm').addEventListener('submit', e => {
                e.preventDefault();
                if (!currentCompanyId) {
                    showAlert('Selecione uma empresa.', 'warning');
                    return;
                }

                const idHidden = document.getElementById('transactionId').value;
                const date = document.getElementById('date').value;
                const type = document.getElementById('type').value;
                const description = document.getElementById('description').value.trim();
                const quantity = parseFloat(document.getElementById('quantity').value);
                const value = parseFloat(document.getElementById('value').value);
                const responsible = document.getElementById('responsible').value.trim();
                const notes = document.getElementById('notes').value.trim();

                const total = quantity * value;

                const paymentDetails = {};
                let sumPayments = 0;
                paymentMethodCheckboxes.forEach(cb => {
                    if (cb.checked) {
                        const method = cb.value;
                        const val = parseFloat(paymentValueInputs[method].value) || 0;
                        if (val > 0) {
                            paymentDetails[method] = val;
                            sumPayments += val;
                        }
                    }
                });

                if (sumPayments === 0) {
                    showAlert('Informe pelo menos um valor em alguma forma de pagamento.', 'warning');
                    return;
                }

                if (Math.abs(sumPayments - total) > 0.01) {
                    showAlert(
                        `Total da transação (${formatCurrency(total)}) é diferente da soma dos pagamentos (${formatCurrency(sumPayments)}).`,
                        'warning'
                    );
                    return;
                }

                const newTransaction = {
                    id: idHidden || Date.now().toString(),
                    date,
                    type,
                    description,
                    quantity,
                    value,
                    totalAbs: total,
                    responsible,
                    notes,
                    paymentDetails
                };

                const existingIndex = transactions.findIndex(t => t.id === newTransaction.id);
                if (existingIndex >= 0) {
                    transactions[existingIndex] = newTransaction;
                    showAlert('Transação atualizada.', 'success');
                } else {
                    transactions.push(newTransaction);
                    showAlert('Transação adicionada.', 'success');
                }

                saveTransactions();
                applyFilters(); // reaplica filtro (ou mostra tudo)
                resetForm();
            });
        });
    </script>
</body>
</html>
