<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestão Financeira Santa Helena</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-body: #0f172a; --bg-main: #020617; --bg-card: #020617; --bg-card-soft: #0b1220;
            --border-subtle: #1e293b; --primary: #3b82f6; --primary-dark: #2563eb;
            --positive: #22c55e; --negative: #ef4444; --text-main: #e5e7eb;
            --text-soft: #9ca3af; --text-muted: #6b7280; --input-bg: #020617;
        }
        * { box-sizing: border-box; }
        body { margin: 0; padding: 0; font-family: "Inter", sans-serif; background-color: var(--bg-body); color: var(--text-main); min-height: 100vh; }
        .topbar { width: 100%; border-bottom: 1px solid var(--border-subtle); background: rgba(15, 23, 42, 0.8); backdrop-filter: blur(12px); position: sticky; top: 0; z-index: 50; }
        .topbar-inner { max-width: 1200px; margin: 0 auto; padding: 12px 20px; display: flex; align-items: center; justify-content: space-between; }
        .main-container { max-width: 1200px; margin: 24px auto; padding: 0 20px; display: grid; grid-template-columns: 380px 1fr; gap: 24px; }
        .card { background-color: var(--bg-card); border: 1px solid var(--border-subtle); border-radius: 16px; padding: 24px; box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2); }
        .summary-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-bottom: 24px; }
        .summary-item { background: var(--bg-card-soft); border: 1px solid var(--border-subtle); border-radius: 16px; padding: 20px; }
        input, select, textarea { width: 100%; background: var(--input-bg); border: 1px solid var(--border-subtle); border-radius: 10px; padding: 10px; color: white; margin-bottom: 12px; }
        button.btn-primary { width: 100%; background: #3b82f6; color: white; border: none; border-radius: 10px; padding: 12px; font-weight: 600; cursor: pointer; }
        table { width: 100%; border-collapse: collapse; font-size: 13px; }
        th, td { padding: 12px; border-bottom: 1px solid var(--border-subtle); text-align: left; }
        .badge { padding: 4px 8px; border-radius: 6px; font-size: 10px; font-weight: bold; text-transform: uppercase; }
        .badge-entrada { background: rgba(34, 197, 94, 0.1); color: #22c55e; }
        .badge-saida { background: rgba(239, 68, 68, 0.1); color: #ef4444; }
        .alert { position: fixed; top: 20px; right: 20px; padding: 16px 24px; border-radius: 12px; z-index: 1000; color: white; font-weight: 600; }
        @media (max-width: 900px) { .main-container { grid-template-columns: 1fr; } }
        @media print { .topbar, .card:first-child, .btn-action, #filterStart { display: none !important; } }
    </style>
</head>
<body>
    <div class="topbar">
        <div class="topbar-inner">
            <div style="display:flex; align-items:center; gap:10px;">
                <div style="width:35px; height:35px; background:linear-gradient(135deg, #3b82f6, #6366f1); border-radius:10px; display:flex; align-items:center; justify-content:center; font-weight:bold;">H</div>
                <h1 style="font-size:18px; margin:0;">Santa Helena</h1>
            </div>
            <div style="display:flex; gap:10px; align-items:center;">
                <select id="companySelect" style="margin:0; width:150px;"></select>
                <button onclick="addCompany()" style="padding:8px 12px; border-radius:8px; background:#3b82f6; border:none; color:white; cursor:pointer; font-weight:bold;">+</button>
            </div>
        </div>
    </div>

    <div class="main-container">
        <div class="card">
            <h2 style="font-size:18px; margin-bottom:20px;">Nova Transação</h2>
            <form id="financeForm">
                <input type="hidden" id="idHidden">
                <label>Data</label><input type="date" id="date" required>
                <label>Tipo</label>
                <select id="type"><option value="entrada">Entrada</option><option value="saida">Saída</option></select>
                <label>Descrição</label><input type="text" id="description" placeholder="Ex: Venda" required>
                <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px;">
                    <div><label>Qtd</label><input type="number" id="quantity" value="1" min="1"></div>
                    <div><label>Valor Unit.</label><input type="number" id="value" step="0.01" placeholder="0,00"></div>
                </div>
                <label>Responsável</label><input type="text" id="responsible">
                <label>Observações</label><textarea id="notes" rows="2"></textarea>
                
                <div style="background:#0b1220; padding:15px; border-radius:12px; border:1px solid #1e293b;">
                    <p style="font-size:12px; margin:0 0 10px 0; color:var(--text-soft);">Pagamento</p>
                    <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px;">
                        <div><small>Dinheiro</small><input type="number" class="pay-input" data-method="Dinheiro" step="0.01" value="0"></div>
                        <div><small>Pix</small><input type="number" class="pay-input" data-method="Pix" step="0.01" value="0"></div>
                        <div><small>Crédito</small><input type="number" class="pay-input" data-method="Crédito" step="0.01" value="0"></div>
                        <div><small>Débito</small><input type="number" class="pay-input" data-method="Débito" step="0.01" value="0"></div>
                    </div>
                </div>
                <button type="submit" class="btn-primary" id="btnSubmit" style="margin-top:20px;">Salvar Lançamento</button>
                <button type="button" id="btnCancel" onclick="resetForm()" style="display:none; background:none; border:1px solid #1e293b; color:white; width:100%; margin-top:10px; padding:10px; border-radius:10px; cursor:pointer;">Cancelar Edição</button>
            </form>
        </div>

        <div>
            <div class="summary-grid">
                <div class="summary-item"><small>Entradas</small><div id="summaryIncomes" style="font-size:20px; color:#22c55e; font-weight:700;">R$ 0,00</div></div>
                <div class="summary-item"><small>Saídas</small><div id="summaryExpenses" style="font-size:20px; color:#ef4444; font-weight:700;">R$ 0,00</div></div>
                <div class="summary-item"><small>Saldo Atual</small><div id="summaryTotal" style="font-size:20px; font-weight:700;">R$ 0,00</div></div>
            </div>
            <div class="card">
                <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px; margin-bottom:15px;">
                    <h2 style="font-size:18px; margin:0;">Histórico</h2>
                    <div style="display:flex; gap:8px;">
                        <input type="date" id="filterStart" onchange="applyFilters()" style="margin:0; width:140px; padding:6px;">
                        <button onclick="imprimirRelatorio()" style="background:#10b981; color:white; border:none; border-radius:8px; padding:6px 12px; cursor:pointer; font-weight:bold;">Imprimir</button>
                        <button onclick="exportarExcel()" style="background:#059669; color:white; border:none; border-radius:8px; padding:6px 12px; cursor:pointer; font-weight:bold;">Excel</button>
                    </div>
                </div>
                <div style="overflow-x:auto;">
                    <table id="transactionsTable">
                        <thead><tr><th>Data</th><th>Tipo</th><th>Descrição</th><th>Total</th><th>Resp.</th><th style="text-align:right;">Ações</th></tr></thead>
                        <tbody></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getDatabase, ref, push, onValue, remove, set } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAReZ9r9rC_l8zraJrxumcNwVE1OM9OMtI",
            authDomain: "caixasantahelena.firebaseapp.com",
            projectId: "caixasantahelena",
            databaseURL: "https://caixasantahelena-default-rtdb.firebaseio.com",
            storageBucket: "caixasantahelena.firebasestorage.app",
            messagingSenderId: "330965689739",
            appId: "1:330965689739:web:7a06a06e12065285137b8e"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        let transactions = [];
        let companies = JSON.parse(localStorage.getItem('companies') || '["Matriz"]');
        let currentCompany = localStorage.getItem('currentCompany') || 'Matriz';

        // --- FUNÇÕES GLOBAIS ---
        window.addCompany = function() {
            const name = prompt('Nome da nova filial:');
            if (name && !companies.includes(name)) {
                companies.push(name);
                localStorage.setItem('companies', JSON.stringify(companies));
                updateCompanySelect();
            }
        };

        window.updateCompanySelect = function() {
            const select = document.getElementById('companySelect');
            select.innerHTML = companies.map(c => `<option value="${c}" ${c === currentCompany ? 'selected' : ''}>${c}</option>`).join('');
        };

        window.applyFilters = function() {
            const filterDate = document.getElementById('filterStart').value;
            let filtered = transactions;
            if (filterDate) filtered = transactions.filter(t => t.date === filterDate);
            renderTable(filtered);
        };

        window.deleteTransaction = function(id) {
            if (confirm('Excluir da nuvem?')) remove(ref(db, `empresas/${currentCompany}/transacoes/${id}`));
        };

        window.editTransaction = function(id) {
            const t = transactions.find(item => item.id === id);
            if (!t) return;
            document.getElementById('idHidden').value = t.id;
            document.getElementById('date').value = t.date;
            document.getElementById('type').value = t.type;
            document.getElementById('description').value = t.description;
            document.getElementById('quantity').value = t.quantity;
            document.getElementById('value').value = t.value;
            document.getElementById('responsible').value = t.responsible;
            document.getElementById('notes').value = t.notes;
            document.querySelectorAll('.pay-input').forEach(input => {
                input.value = t.paymentDetails[input.dataset.method] || 0;
            });
            document.getElementById('btnSubmit').innerText = 'Salvar Alteração';
            document.getElementById('btnCancel').style.display = 'block';
            window.scrollTo({ top: 0, behavior: 'smooth' });
        };

        window.resetForm = function() {
            document.getElementById('financeForm').reset();
            document.getElementById('idHidden').value = '';
            document.getElementById('btnSubmit').innerText = 'Salvar Lançamento';
            document.getElementById('btnCancel').style.display = 'none';
        };

        // --- IMPRIMIR E EXCEL ---
        window.imprimirRelatorio = function() {
            const resumo = document.querySelector('.summary-grid').innerHTML;
            const tabela = document.getElementById('transactionsTable').outerHTML;
            const win = window.open('', '', 'height=700,width=900');
            win.document.write(`<html><head><title>Relatório - ${currentCompany}</title><style>
                body { font-family: sans-serif; padding: 20px; }
                table { width: 100%; border-collapse: collapse; }
                th, td { border: 1px solid #ccc; padding: 8px; text-align: left; }
                .summary-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin-bottom: 20px; }
                .summary-item { border: 1px solid #ccc; padding: 10px; border-radius: 8px; }
            </style></head><body>
                <h1>Relatório Santa Helena - ${currentCompany}</h1>
                <div class="summary-grid">${resumo}</div>
                ${tabela}
            </body></html>`);
            win.document.close();
            win.print();
        };

        window.exportarExcel = function() {
            let csv = '\uFEFFData;Tipo;Descricao;Total;Responsavel\n';
            transactions.forEach(t => {
                csv += `${t.date.split('-').reverse().join('/')};${t.type};${t.description};${t.totalAbs.toFixed(2)};${t.responsible || '-'}\n`;
            });
            const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement("a");
            link.href = URL.createObjectURL(blob);
            link.download = `relatorio_${currentCompany}.csv`;
            link.click();
        };

        // --- FIREBASE LOGIC ---
        function loadFromFirebase() {
            onValue(ref(db, `empresas/${currentCompany}/transacoes`), (snapshot) => {
                const data = snapshot.val();
                transactions = data ? Object.keys(data).map(key => ({ id: key, ...data[key] })) : [];
                window.applyFilters();
            });
        }

        document.getElementById('financeForm').onsubmit = function(e) {
            e.preventDefault();
            const id = document.getElementById('idHidden').value;
            const q = parseInt(document.getElementById('quantity').value) || 1;
            const v = parseFloat(document.getElementById('value').value) || 0;
            const total = q * v;

            const pays = {}; let sum = 0;
            document.querySelectorAll('.pay-input').forEach(i => {
                const val = parseFloat(i.value) || 0;
                if(val > 0) { pays[i.dataset.method] = val; sum += val; }
            });

            if (sum === 0 || Math.abs(sum - total) > 0.01) {
                alert('Erro: Pagamento não confere com o total!'); return;
            }

            const trans = {
                date: document.getElementById('date').value,
                type: document.getElementById('type').value,
                description: document.getElementById('description').value,
                quantity: q, value: v, totalAbs: total,
                responsible: document.getElementById('responsible').value,
                notes: document.getElementById('notes').value,
                paymentDetails: pays
            };

            if (id) set(ref(db, `empresas/${currentCompany}/transacoes/${id}`), trans);
            else push(ref(db, `empresas/${currentCompany}/transacoes`), trans);
            window.resetForm();
        };

        function renderTable(data) {
            const tbody = document.querySelector('#transactionsTable tbody');
            tbody.innerHTML = '';
            let inc = 0, exp = 0;

            data.sort((a,b) => new Date(b.date) - new Date(a.date)).forEach(t => {
                if (t.type === 'entrada') inc += t.totalAbs; else exp += t.totalAbs;
                tbody.innerHTML += `<tr>
                    <td>${t.date.split('-').reverse().join('/')}</td>
                    <td><span class="badge badge-${t.type}">${t.type}</span></td>
                    <td><b>${t.description}</b><br><small>${Object.entries(t.paymentDetails).map(([k,v])=>`${k}: R$${v.toFixed(2)}`).join(' | ')}</small></td>
                    <td>R$ ${t.totalAbs.toFixed(2)}</td>
                    <td>${t.responsible || '-'}</td>
                    <td style="text-align:right;">
                        <button onclick="editTransaction('${t.id}')" style="background:none; border:none; color:#3b82f6; cursor:pointer; font-size:16px;">✎</button>
                        <button onclick="deleteTransaction('${t.id}')" style="background:none; border:none; color:#ef4444; cursor:pointer; font-size:16px; margin-left:10px;">✕</button>
                    </td>
                </tr>`;
            });

            document.getElementById('summaryIncomes').innerText = `R$ ${inc.toFixed(2)}`;
            document.getElementById('summaryExpenses').innerText = `R$ ${exp.toFixed(2)}`;
            const tot = inc - exp;
            document.getElementById('summaryTotal').innerText = `R$ ${tot.toFixed(2)}`;
            document.getElementById('summaryTotal').style.color = tot >= 0 ? '#22c55e' : '#ef4444';
        }

        document.getElementById('companySelect').onchange = (e) => {
            currentCompany = e.target.value;
            localStorage.setItem('currentCompany', currentCompany);
            loadFromFirebase();
        };

        updateCompanySelect();
        loadFromFirebase();
    </script>
</body>
</html>
