<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gestão Financeira Firebase</title>
</head>

<body style="font-family: Arial; padding:20px">

<h2>💰 Gestão Financeira (Firebase)</h2>

<label>Empresa:</label>
<select id="empresa"></select>
<button onclick="novaEmpresa()">+ Empresa</button>

<hr>

<input type="text" id="descricao" placeholder="Descrição">
<input type="number" id="valor" placeholder="Valor">
<select id="tipo">
  <option value="entrada">Entrada</option>
  <option value="saida">Saída</option>
</select>

<button onclick="salvar()">Salvar</button>

<h3>Transações</h3>
<ul id="lista"></ul>

<h3>Resumo</h3>
<p id="entrada"></p>
<p id="saida"></p>
<p id="saldo"></p>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-app.js";
import { getDatabase, ref, push, onValue, set, remove } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-database.js";

// CONFIG (A SUA)
const firebaseConfig = {
  apiKey: "AIzaSyAEeOilHu6K2qvyB-49kyqx0K9dXAgW74c",
  authDomain: "gestaofinanceiracaixa.firebaseapp.com",
  databaseURL: "https://gestaofinanceiracaixa-default-rtdb.firebaseio.com",
  projectId: "gestaofinanceiracaixa",
  storageBucket: "gestaofinanceiracaixa.firebasestorage.app",
  messagingSenderId: "15986056077",
  appId: "1:15986056077:web:2f43cb7abd56fe69cc7bc4"
};

// INICIAR
const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

// ================= VARIÁVEIS =================
let empresaAtual = null;

// ================= EMPRESAS =================
const empresasRef = ref(db, "empresas");

function carregarEmpresas() {
  onValue(empresasRef, (snapshot) => {
    const select = document.getElementById("empresa");
    select.innerHTML = "";

    snapshot.forEach(child => {
      const opt = document.createElement("option");
      opt.value = child.key;
      opt.textContent = child.val().nome;
      select.appendChild(opt);
    });

    if (select.options.length > 0) {
      empresaAtual = select.value;
      carregarTransacoes();
    }
  });
}

// NOVA EMPRESA
window.novaEmpresa = function() {
  const nome = prompt("Nome da empresa:");
  if (!nome) return;

  const novaRef = push(empresasRef);
  set(novaRef, { nome });

  empresaAtual = novaRef.key;
  carregarTransacoes();
};

// TROCAR EMPRESA
document.getElementById("empresa").addEventListener("change", (e) => {
  empresaAtual = e.target.value;
  carregarTransacoes();
});

// ================= TRANSAÇÕES =================
function transacoesRef() {
  return ref(db, "transacoes/" + empresaAtual);
}

function carregarTransacoes() {
  if (!empresaAtual) return;

  onValue(transacoesRef(), (snapshot) => {
    const lista = document.getElementById("lista");
    lista.innerHTML = "";

    let entrada = 0;
    let saida = 0;

    snapshot.forEach(child => {
      const t = child.val();
      const id = child.key;

      if (t.tipo === "entrada") entrada += t.valor;
      else saida += t.valor;

      const li = document.createElement("li");
      li.innerHTML = `
        ${t.descricao} - R$ ${t.valor} (${t.tipo})
        <button onclick="excluir('${id}')">Excluir</button>
      `;
      lista.appendChild(li);
    });

    document.getElementById("entrada").textContent = "Entradas: R$ " + entrada;
    document.getElementById("saida").textContent = "Saídas: R$ " + saida;
    document.getElementById("saldo").textContent = "Saldo: R$ " + (entrada - saida);
  });
}

// SALVAR
window.salvar = function() {
  if (!empresaAtual) {
    alert("Crie uma empresa primeiro!");
    return;
  }

  const descricao = document.getElementById("descricao").value;
  const valor = parseFloat(document.getElementById("valor").value);
  const tipo = document.getElementById("tipo").value;

  if (!descricao || isNaN(valor)) {
    alert("Preencha corretamente!");
    return;
  }

  push(transacoesRef(), {
    descricao,
    valor,
    tipo,
    data: new Date().toISOString()
  });

  document.getElementById("descricao").value = "";
  document.getElementById("valor").value = "";
};

// EXCLUIR
window.excluir = function(id) {
  remove(ref(db, "transacoes/" + empresaAtual + "/" + id));
};

// INICIAR
carregarEmpresas();

</script>

</body>
</html>
