<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
    import { getDatabase, ref, push, onValue, remove, set } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-database.js";

    // Configuração do seu Banco (Já com as suas chaves)
    const firebaseConfig = {
        apiKey: "AIzaSyAReZ9r9rC_l8zraJrxumcNwVE1OM9OMtI",
        authDomain: "caixasantahelena.firebaseapp.com",
        projectId: "caixasantahelena",
        databaseURL: "https://caixasantahelena-default-rtdb.firebaseio.com",
        storageBucket: "caixasantahelena.firebasestorage.app",
        messagingSenderId: "330965689739",
        appId: "1:330965689739:web:7a06a06e12065285137b8e"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    // Variáveis Globais (Mantendo sua lógica)
    let transactions = [];
    let companies = JSON.parse(localStorage.getItem('companies') || '["Matriz"]');
    let currentCompany = localStorage.getItem('currentCompany') || 'Matriz';

    const companySelect = document.getElementById('companySelect');
    const financeForm = document.getElementById('financeForm');
    const tableBody = document.querySelector('#transactionsTable tbody');

    // --- FUNÇÕES DE EMPRESA (IDÊNTICAS ÀS SUAS) ---
    window.updateCompanySelect = function() {
        companySelect.innerHTML = companies.map(c => `<option value="${c}" ${c === currentCompany ? 'selected' : ''}>${c}</option>`).join('');
    };

    window.addCompany = function() {
        const name = prompt('Nome da nova empresa/filial:');
        if (name && !companies.includes(name)) {
            companies.push(name);
            localStorage.setItem('companies', JSON.stringify(companies));
            updateCompanySelect();
        }
    };

    companySelect.addEventListener('change', (e) => {
        currentCompany = e.target.value;
        localStorage.setItem('currentCompany', currentCompany);
        conectarFirebase();
    });

    // --- CONEXÃO EM TEMPO REAL ---
    function conectarFirebase() {
        const transRef = ref(db, `empresas/${currentCompany}/transacoes`);
        onValue(transRef, (snapshot) => {
            const data = snapshot.val();
            transactions = data ? Object.keys(data).map(key => ({ id: key, ...data[key] })) : [];
            window.applyFilters(); // Usa sua função de filtro original
        });
    }

    // --- SALVAR LANÇAMENTO (COM SUAS VALIDAÇÕES) ---
    financeForm.addEventListener('submit', function(e) {
        e.preventDefault();

        const idHidden = document.getElementById('idHidden').value;
        const date = document.getElementById('date').value;
        const type = document.getElementById('type').value;
        const description = document.getElementById('description').value;
        const quantity = parseInt(document.getElementById('quantity').value);
        const value = parseFloat(document.getElementById('value').value);
        const total = quantity * value;
        const responsible = document.getElementById('responsible').value;
        const notes = document.getElementById('notes').value;

        const paymentDetails = {};
        let sumPayments = 0;
        document.querySelectorAll('.pay-input').forEach(input => {
            const val = parseFloat(input.value) || 0;
            if (val > 0) {
                paymentDetails[input.dataset.method] = val;
                sumPayments += val;
            }
        });

        // Suas mensagens de alerta originais
        if (sumPayments === 0) {
            window.showAlert('Por favor, informe um valor em alguma forma de pagamento.', 'warning');
            return;
        }
        if (Math.abs(sumPayments - total) > 0.01) {
            window.showAlert(`Total (R$ ${total.toFixed(2)}) é diferente da soma dos pagamentos (R$ ${sumPayments.toFixed(2)}).`, 'warning');
            return;
        }

        const transacao = { date, type, description, quantity, value, totalAbs: total, responsible, notes, paymentDetails };

        if (idHidden) {
            set(ref(db, `empresas/${currentCompany}/transacoes/${idHidden}`), transacao)
                .then(() => { window.showAlert('Transação atualizada na nuvem!', 'success'); window.resetForm(); });
        } else {
            push(ref(db, `empresas/${currentCompany}/transacoes`), transacao)
                .then(() => { window.showAlert('Transação salva na nuvem!', 'success'); window.resetForm(); });
        }
    });

    // --- FUNÇÕES DE INTERFACE (MANTIDAS EXATAMENTE COMO VOCÊ GOSTA) ---
    window.renderTable = function(data) {
        tableBody.innerHTML = '';
        let inc = 0, exp = 0;

        data.sort((a,b) => new Date(b.date) - new Date(a.date)).forEach(t => {
            if (t.type === 'entrada') inc += t.totalAbs; else exp += t.totalAbs;
            
            const row = document.createElement('tr');
            row.innerHTML = `
                <td>${t.date.split('-').reverse().join('/')}</td>
                <td><span class="badge badge-${t.type}">${t.type}</span></td>
                <td>
                    <div style="font-weight:600">${t.description}</div>
                    <div style="font-size:11px; color:var(--text-muted)">
                        ${Object.entries(t.paymentDetails).map(([k,v]) => `${k}: R$${v.toFixed(2)}`).join(' | ')}
                    </div>
                </td>
                <td>R$ ${t.totalAbs.toLocaleString('pt-BR', {minimumFractionDigits:2})}</td>
                <td>${t.responsible || '-'}</td>
                <td style="text-align:right;">
                    <button onclick="editTransaction('${t.id}')" style="background:none; border:none; color:var(--primary); cursor:pointer; margin-right:10px;">✎</button>
                    <button onclick="deleteTransaction('${t.id}')" style="background:none; border:none; color:var(--negative); cursor:pointer;">✕</button>
                </td>
            `;
            tableBody.appendChild(row);
        });

        document.getElementById('summaryIncomes').innerText = `R$ ${inc.toLocaleString('pt-BR', {minimumFractionDigits:2})}`;
        document.getElementById('summaryExpenses').innerText = `R$ ${exp.toLocaleString('pt-BR', {minimumFractionDigits:2})}`;
        const totalFinal = inc - exp;
        const summaryTotal = document.getElementById('summaryTotal');
        summaryTotal.innerText = `R$ ${totalFinal.toLocaleString('pt-BR', {minimumFractionDigits:2})}`;
        summaryTotal.style.color = totalFinal >= 0 ? 'var(--positive)' : 'var(--negative)';
    };

    window.editTransaction = (id) => {
        const t = transactions.find(item => item.id === id);
        if (!t) return;
        document.getElementById('idHidden').value = t.id;
        document.getElementById('date').value = t.date;
        document.getElementById('type').value = t.type;
        document.getElementById('description').value = t.description;
        document.getElementById('quantity').value = t.quantity;
        document.getElementById('value').value = t.value;
        document.getElementById('responsible').value = t.responsible;
        document.getElementById('notes').value = t.notes;
        document.querySelectorAll('.pay-input').forEach(input => {
            input.value = t.paymentDetails[input.dataset.method] || 0;
        });
        document.getElementById('btnSubmit').innerText = 'Salvar Alteração';
        document.getElementById('btnCancel').style.display = 'block';
        window.scrollTo({ top: 0, behavior: 'smooth' });
    };

    window.deleteTransaction = (id) => {
        if (confirm('Deseja excluir este registro da nuvem?')) {
            remove(ref(db, `empresas/${currentCompany}/transacoes/${id}`));
        }
    };

    window.applyFilters = () => {
        const start = document.getElementById('filterStart').value;
        let filtered = [...transactions];
        if (start) filtered = filtered.filter(t => t.date === start);
        window.renderTable(filtered);
    };

    window.resetForm = () => {
        financeForm.reset();
        document.getElementById('idHidden').value = '';
        document.getElementById('btnSubmit').innerText = 'Salvar Lançamento';
        document.getElementById('btnCancel').style.display = 'none';
    };

    window.showAlert = (msg, type) => {
        const div = document.createElement('div');
        div.className = 'alert';
        div.style.cssText = `position:fixed; top:20px; right:20px; padding:16px 24px; border-radius:12px; z-index:1000; color:white; font-weight:600; background:${type === 'success' ? '#059669' : '#dc2626'}`;
        div.innerText = msg;
        document.body.appendChild(div);
        setTimeout(() => div.remove(), 3000);
    };

    // Inicialização
    updateCompanySelect();
    conectarFirebase();
</script>
