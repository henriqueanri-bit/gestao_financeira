<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestão Financeira Santa Helena</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-body: #0f172a; --bg-main: #020617; --bg-card: #020617; --bg-card-soft: #0b1220;
            --border-subtle: #1e293b; --primary: #3b82f6; --primary-dark: #2563eb;
            --positive: #22c55e; --negative: #ef4444; --text-main: #e5e7eb;
            --text-soft: #9ca3af; --text-muted: #6b7280; --input-bg: #020617;
        }
        * { box-sizing: border-box; }
        body { margin: 0; padding: 0; font-family: "Inter", sans-serif; background-color: var(--bg-body); color: var(--text-main); min-height: 100vh; }
        .topbar { width: 100%; border-bottom: 1px solid var(--border-subtle); background: rgba(15, 23, 42, 0.8); backdrop-filter: blur(12px); position: sticky; top: 0; z-index: 50; }
        .topbar-inner { max-width: 1200px; margin: 0 auto; padding: 12px 20px; display: flex; align-items: center; justify-content: space-between; }
        .main-container { max-width: 1200px; margin: 24px auto; padding: 0 20px; display: grid; grid-template-columns: 380px 1fr; gap: 24px; }
        .card { background-color: var(--bg-card); border: 1px solid var(--border-subtle); border-radius: 16px; padding: 24px; box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2); }
        .summary-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-bottom: 16px; }
        .summary-item { background: var(--bg-card-soft); border: 1px solid var(--border-subtle); border-radius: 16px; padding: 20px; }
        .payment-summary { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 24px; }
        .pay-card { background: #1e293b66; padding: 12px; border-radius: 12px; border: 1px solid var(--border-subtle); text-align: center; }
        .pay-card small { color: var(--text-soft); font-size: 11px; }
        .pay-card div { font-weight: bold; font-size: 14px; margin-top: 4px; }
        input, select, textarea { width: 100%; background: var(--input-bg); border: 1px solid var(--border-subtle); border-radius: 10px; padding: 10px; color: white; margin-bottom: 12px; }
        button { cursor: pointer; transition: 0.2s; }
        button.btn-primary { width: 100%; background: #3b82f6; color: white; border: none; border-radius: 10px; padding: 12px; font-weight: 600; }
        table { width: 100%; border-collapse: collapse; font-size: 12px; }
        th, td { padding: 12px; border-bottom: 1px solid var(--border-subtle); text-align: left; vertical-align: top; }
        .badge { padding: 4px 8px; border-radius: 6px; font-size: 10px; font-weight: bold; text-transform: uppercase; }
        .badge-entrada { background: rgba(34, 197, 94, 0.1); color: #22c55e; }
        .badge-saida { background: rgba(239, 68, 68, 0.1); color: #ef4444; }
        @media (max-width: 900px) { .main-container { grid-template-columns: 1fr; } .payment-summary { grid-template-columns: 1fr 1fr; } }
    </style>
</head>
<body>
    <div class="topbar">
        <div class="topbar-inner">
            <h1 style="font-size:18px; margin:0;">Santa Helena - Gestão</h1>
            <div style="display:flex; gap:10px;">
                <select id="companySelect" style="margin:0; width:150px;"></select>
                <button onclick="addCompany()" style="padding:8px 12px; border-radius:8px; background:#3b82f6; border:none; color:white;">+</button>
            </div>
        </div>
    </div>

    <div class="main-container">
        <div class="card">
            <h2 style="font-size:18px; margin-bottom:20px;">Nova Transação</h2>
            <form id="financeForm">
                <input type="hidden" id="idHidden">
                <label>Data</label><input type="date" id="date" required>
                <label>Tipo</label>
                <select id="type"><option value="entrada">Entrada</option><option value="saida">Saída</option></select>
                <label>Descrição</label><input type="text" id="description" required placeholder="Ex: Venda de Peças">
                <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px;">
                    <div><label>Qtd</label><input type="number" id="quantity" value="1"></div>
                    <div><label>Valor Unit.</label><input type="number" id="value" step="0.01" placeholder="0,00"></div>
                </div>
                <label>Responsável</label><input type="text" id="responsible" placeholder="Quem lançou?">
                <label>Observações</label><textarea id="notes" rows="2" placeholder="Detalhes adicionais..."></textarea>
                
                <div style="background:#0b1220; padding:15px; border-radius:12px; border:1px solid #1e293b; margin-top:10px;">
                    <p style="font-size:12px; margin:0 0 10px 0; color:var(--text-soft);">Detalhamento de Pagamento</p>
                    <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px;">
                        <div><small>Dinheiro</small><input type="number" class="pay-input" data-method="Dinheiro" step="0.01" value="0"></div>
                        <div><small>Pix</small><input type="number" class="pay-input" data-method="Pix" step="0.01" value="0"></div>
                        <div><small>Crédito</small><input type="number" class="pay-input" data-method="Crédito" step="0.01" value="0"></div>
                        <div><small>Débito</small><input type="number" class="pay-input" data-method="Débito" step="0.01" value="0"></div>
                    </div>
                </div>
                <button type="submit" class="btn-primary" style="margin-top:20px;">Salvar Lançamento</button>
            </form>
        </div>

        <div>
            <div class="summary-grid">
                <div class="summary-item"><small>Entradas</small><div id="summaryIncomes" style="color:#22c55e; font-weight:700;">R$ 0,00</div></div>
                <div class="summary-item"><small>Saídas</small><div id="summaryExpenses" style="color:#ef4444; font-weight:700;">R$ 0,00</div></div>
                <div class="summary-item"><small>Saldo</small><div id="summaryTotal" style="font-weight:700;">R$ 0,00</div></div>
            </div>

            <div class="payment-summary">
                <div class="pay-card"><small>PIX</small><div id="sumPix" style="color:#22c55e;">R$ 0,00</div></div>
                <div class="pay-card"><small>DINHEIRO</small><div id="sumDinheiro" style="color:#22c55e;">R$ 0,00</div></div>
                <div class="pay-card"><small>C. CRÉDITO</small><div id="sumCredito" style="color:#22c55e;">R$ 0,00</div></div>
                <div class="pay-card"><small>C. DÉBITO</small><div id="sumDebito" style="color:#22c55e;">R$ 0,00</div></div>
            </div>

            <div class="card">
                <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px; margin-bottom:15px;">
                    <h2 style="font-size:18px; margin:0;">Histórico de Lançamentos</h2>
                    <div style="display:flex; gap:8px;">
                        <input type="date" id="filterStart" onchange="applyFilters()" style="margin:0; width:140px;">
                        <button onclick="imprimirRelatorio()" style="background:#10b981; color:white; border:none; border-radius:8px; padding:6px 12px; font-weight:bold;">Imprimir</button>
                        <button onclick="exportarExcel()" style="background:#059669; color:white; border:none; border-radius:8px; padding:6px 12px; font-weight:bold;">Excel</button>
                    </div>
                </div>
                <div style="overflow-x:auto;">
                    <table id="transactionsTable">
                        <thead><tr><th>Data</th><th>Tipo</th><th>Descrição / Obs</th><th>Total</th><th>Resp.</th><th style="text-align:right;">Ações</th></tr></thead>
                        <tbody></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getDatabase, ref, push, onValue, remove, set } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAReZ9r9rC_l8zraJrxumcNwVE1OM9OMtI",
            authDomain: "caixasantahelena.firebaseapp.com",
            projectId: "caixasantahelena",
            databaseURL: "https://caixasantahelena-default-rtdb.firebaseio.com",
            storageBucket: "caixasantahelena.firebasestorage.app",
            messagingSenderId: "330965689739",
            appId: "1:330965689739:web:7a06a06e12065285137b8e"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        let transactions = [];
        let companies = JSON.parse(localStorage.getItem('companies') || '["Matriz"]');
        let currentCompany = localStorage.getItem('currentCompany') || 'Matriz';

        window.updateCompanySelect = () => {
            document.getElementById('companySelect').innerHTML = companies.map(c => `<option value="${c}" ${c === currentCompany ? 'selected' : ''}>${c}</option>`).join('');
        };

        window.addCompany = () => {
            const name = prompt('Nome da filial:');
            if (name) { companies.push(name); localStorage.setItem('companies', JSON.stringify(companies)); updateCompanySelect(); }
        };

        window.applyFilters = () => {
            const date = document.getElementById('filterStart').value;
            renderTable(date ? transactions.filter(t => t.date === date) : transactions);
        };

        window.imprimirRelatorio = () => { window.print(); };

        window.exportarExcel = () => {
            let csv = '\uFEFFData;Tipo;Descricao;Observacao;Responsavel;Dinheiro;Pix;Credito;Debito;Total\n';
            transactions.forEach(t => {
                const p = t.paymentDetails || {};
                csv += `${t.date.split('-').reverse().join('/')};${t.type};${t.description};${t.notes || ''};${t.responsible || ''};${(p.Dinheiro||0).toFixed(2)};${(p.Pix||0).toFixed(2)};${(p.Crédito||0).toFixed(2)};${(p.Débito||0).toFixed(2)};${t.totalAbs.toFixed(2)}\n`;
            });
            const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement("a");
            link.href = URL.createObjectURL(blob);
            link.download = `caixa_${currentCompany}.csv`;
            link.click();
        };

        function loadData() {
            onValue(ref(db, `empresas/${currentCompany}/transacoes`), (snap) => {
                const val = snap.val();
                transactions = val ? Object.keys(val).map(k => ({ id: k, ...val[k] })) : [];
                window.applyFilters();
            });
        }

        document.getElementById('financeForm').onsubmit = (e) => {
            e.preventDefault();
            const id = document.getElementById('idHidden').value;
            const q = parseInt(document.getElementById('quantity').value) || 1;
            const v = parseFloat(document.getElementById('value').value) || 0;
            const pays = {};
            document.querySelectorAll('.pay-input').forEach(i => { if(parseFloat(i.value)>0) pays[i.dataset.method] = parseFloat(i.value); });

            const data = {
                date: document.getElementById('date').value,
                type: document.getElementById('type').value,
                description: document.getElementById('description').value,
                responsible: document.getElementById('responsible').value,
                notes: document.getElementById('notes').value,
                quantity: q, value: v, totalAbs: q * v,
                paymentDetails: pays
            };

            if(id) set(ref(db, `empresas/${currentCompany}/transacoes/${id}`), data);
            else push(ref(db, `empresas/${currentCompany}/transacoes`), data);
            e.target.reset();
        };

        function renderTable(data) {
            const tbody = document.querySelector('#transactionsTable tbody');
            tbody.innerHTML = '';
            let inc=0, exp=0, pPix=0, pDin=0, pCre=0, pDeb=0;

            data.sort((a,b) => new Date(b.date) - new Date(a.date)).forEach(t => {
                if (t.type === 'entrada') {
                    inc += t.totalAbs;
                    pPix += (t.paymentDetails?.Pix || 0);
                    pDin += (t.paymentDetails?.Dinheiro || 0);
                    pCre += (t.paymentDetails?.Crédito || 0);
                    pDeb += (t.paymentDetails?.Débito || 0);
                } else exp += t.totalAbs;

                tbody.innerHTML += `<tr>
                    <td>${t.date.split('-').reverse().join('/')}</td>
                    <td><span class="badge badge-${t.type}">${t.type}</span></td>
                    <td>
                        <div style="font-weight:700">${t.description}</div>
                        <div style="font-size:11px; color:var(--text-soft)">${t.notes || ''}</div>
                    </td>
                    <td>R$ ${t.totalAbs.toFixed(2)}</td>
                    <td>${t.responsible || '-'}</td>
                    <td style="text-align:right;"><button onclick="deleteItem('${t.id}')" style="background:none; border:none; color:#ef4444; font-weight:bold;">✕</button></td>
                </tr>`;
            });

            document.getElementById('sumPix').innerText = `R$ ${pPix.toFixed(2)}`;
            document.getElementById('sumDinheiro').innerText = `R$ ${pDin.toFixed(2)}`;
            document.getElementById('sumCredito').innerText = `R$ ${pCre.toFixed(2)}`;
            document.getElementById('sumDebito').innerText = `R$ ${pDeb.toFixed(2)}`;
            document.getElementById('summaryIncomes').innerText = `R$ ${inc.toFixed(2)}`;
            document.getElementById('summaryExpenses').innerText = `R$ ${exp.toFixed(2)}`;
            const total = inc - exp;
            document.getElementById('summaryTotal').innerText = `R$ ${total.toFixed(2)}`;
            document.getElementById('summaryTotal').style.color = total >= 0 ? '#22c55e' : '#ef4444';
        }

        window.deleteItem = (id) => { if(confirm('Excluir este lançamento?')) remove(ref(db, `empresas/${currentCompany}/transacoes/${id}`)); };
        document.getElementById('companySelect').onchange = (e) => { currentCompany = e.target.value; localStorage.setItem('currentCompany', currentCompany); loadData(); };

        updateCompanySelect();
        loadData();
    </script>
</body>
</html>
