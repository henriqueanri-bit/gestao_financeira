<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestão Financeira Cloud - Henrique</title>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-body: #0f172a;
            --primary: #3b82f6;
            --primary-dark: #2563eb;
            --positive: #22c55e;
            --negative: #ef4444;
            --text-main: #e5e7eb;
            --text-soft: #9ca3af;
            --border-subtle: #1e293b;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: "Inter", sans-serif;
            background: radial-gradient(circle at top, #1f2937 0, #020617 45%, #000 100%);
            color: var(--text-main);
            min-height: 100vh;
            padding-bottom: 40px;
        }

        /* Barra Superior */
        .topbar {
            width: 100%;
            border-bottom: 1px solid #1f2937;
            background: rgba(15,23,42,0.95);
            backdrop-filter: blur(16px);
            position: sticky;
            top: 0;
            z-index: 20;
            padding: 10px 0;
        }

        .topbar-inner {
            max-width: 1120px;
            margin: 0 auto;
            padding: 0 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .logo-mark {
            width: 35px;
            height: 35px;
            border-radius: 50%;
            background: linear-gradient(135deg, #3b82f6, #6366f1);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            box-shadow: 0 0 15px rgba(59, 130, 246, 0.5);
        }

        /* Cards de Resumo */
        .page { max-width: 1120px; margin: 20px auto; padding: 0 16px; }

        .summary-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 15px;
            margin-bottom: 25px;
        }

        .summary-card {
            background: rgba(15,23,42,0.8);
            border: 1px solid var(--border-subtle);
            padding: 20px;
            border-radius: 12px;
            text-align: center;
        }

        .summary-card h3 { margin: 0; font-size: 12px; color: var(--text-soft); text-transform: uppercase; }
        .summary-card p { margin: 10px 0 0; font-size: 24px; font-weight: 700; }

        /* Layout Principal */
        .main-grid {
            display: grid;
            grid-template-columns: 350px 1fr;
            gap: 20px;
        }

        .card {
            background: #020617;
            border: 1px solid var(--border-subtle);
            padding: 20px;
            border-radius: 12px;
        }

        label { display: block; font-size: 12px; color: var(--text-soft); margin-bottom: 5px; }
        
        input, select {
            width: 100%;
            background: #0f172a;
            border: 1px solid var(--border-subtle);
            color: white;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 15px;
            outline: none;
        }

        .btn-save {
            width: 100%;
            background: var(--primary);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn-save:hover { background: var(--primary-dark); }

        /* Tabela */
        .table-container { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th { text-align: left; padding: 12px; border-bottom: 2px solid var(--border-subtle); color: var(--text-soft); font-size: 13px; }
        td { padding: 12px; border-bottom: 1px solid var(--border-subtle); font-size: 14px; }

        .btn-delete { background: none; border: none; color: var(--negative); cursor: pointer; font-weight: bold; }

        @media (max-width: 850px) {
            .main-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <div class="topbar">
        <div class="topbar-inner">
            <div style="display:flex; align-items:center; gap:12px;">
                <div class="logo-mark">H</div>
                <span style="font-weight:600; font-size:18px;">Gestão Sete Lagoas</span>
            </div>
            <div style="font-size:12px; color:var(--positive)">● Online Cloud</div>
        </div>
    </div>

    <div class="page">
        <div class="summary-grid">
            <div class="summary-card">
                <h3>Entradas</h3>
                <p id="totalEntrada" style="color: var(--positive);">R$ 0,00</p>
            </div>
            <div class="summary-card">
                <h3>Saídas</h3>
                <p id="totalSaida" style="color: var(--negative);">R$ 0,00</p>
            </div>
            <div class="summary-card">
                <h3>Saldo em Caixa</h3>
                <p id="saldoLiquido">R$ 0,00</p>
            </div>
        </div>

        <div class="main-grid">
            <div class="card">
                <h2 style="font-size:18px; margin-top:0;">Novo Registro</h2>
                <form id="formTransacao">
                    <label>Data</label>
                    <input type="date" id="dataInput" required>

                    <label>Tipo</label>
                    <select id="tipoInput">
                        <option value="entrada">Entrada (+)</option>
                        <option value="saida">Saída (-)</option>
                    </select>

                    <label>Descrição</label>
                    <input type="text" id="descInput" placeholder="Ex: Venda de peça" required>

                    <label>Valor (R$)</label>
                    <input type="number" id="valorInput" step="0.01" placeholder="0,00" required>

                    <button type="submit" class="btn-save">Salvar na Nuvem</button>
                </form>
            </div>

            <div class="card">
                <h2 style="font-size:18px; margin-top:0;">Histórico Recente</h2>
                <div class="table-container">
                    <table>
                        <thead>
                            <tr>
                                <th>Data</th>
                                <th>Tipo</th>
                                <th>Descrição</th>
                                <th>Valor</th>
                                <th></th>
                            </tr>
                        </thead>
                        <tbody id="tabelaCorpo">
                            </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getDatabase, ref, push, onValue, remove } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-database.js";

        // Sua configuração que você passou
        const firebaseConfig = {
            apiKey: "AIzaSyAReZ9r9rC_l8zraJrxumcNwVE1OM9OMtI",
            authDomain: "caixasantahelena.firebaseapp.com",
            projectId: "caixasantahelena",
            databaseURL: "https://caixasantahelena-default-rtdb.firebaseio.com",
            storageBucket: "caixasantahelena.firebasestorage.app",
            messagingSenderId: "330965689739",
            appId: "1:330965689739:web:7a06a06e12065285137b8e"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const dbRef = ref(db, 'movimentacoes');

        // FORMULÁRIO - SALVAR
        const form = document.getElementById('formTransacao');
        form.addEventListener('submit', (e) => {
            e.preventDefault();
            
            const dados = {
                data: document.getElementById('dataInput').value,
                tipo: document.getElementById('tipoInput').value,
                descricao: document.getElementById('descInput').value,
                valor: parseFloat(document.getElementById('valorInput').value)
            };

            push(dbRef, dados).then(() => {
                form.reset();
                alert("Salvo com sucesso!");
            });
        });

        // ESCUTAR MUDANÇAS (REALTIME)
        onValue(dbRef, (snapshot) => {
            const lista = snapshot.val();
            renderizar(lista);
        });

        function renderizar(lista) {
            const corpo = document.getElementById('tabelaCorpo');
            corpo.innerHTML = "";
            
            let totalE = 0;
            let totalS = 0;

            if (lista) {
                // Converter objeto em array e ordenar por data
                const itens = Object.keys(lista).map(key => ({ id: key, ...lista[key] }));
                itens.sort((a, b) => new Date(b.data) - new Date(a.data));

                itens.forEach(item => {
                    if(item.tipo === 'entrada') totalE += item.valor;
                    else totalS += item.valor;

                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td>${item.data.split('-').reverse().join('/')}</td>
                        <td style="color:${item.tipo === 'entrada' ? '#22c55e' : '#ef4444'}">${item.tipo.toUpperCase()}</td>
                        <td>${item.descricao}</td>
                        <td>R$ ${item.valor.toLocaleString('pt-BR', {minimumFractionDigits: 2})}</td>
                        <td><button class="btn-delete" onclick="apagarRegistro('${item.id}')">Excluir</button></td>
                    `;
                    corpo.appendChild(tr);
                });
            }

            document.getElementById('totalEntrada').innerText = `R$ ${totalE.toLocaleString('pt-BR', {minimumFractionDigits: 2})}`;
            document.getElementById('totalSaida').innerText = `R$ ${totalS.toLocaleString('pt-BR', {minimumFractionDigits: 2})}`;
            const saldo = totalE - totalS;
            document.getElementById('saldoLiquido').innerText = `R$ ${saldo.toLocaleString('pt-BR', {minimumFractionDigits: 2})}`;
            document.getElementById('saldoLiquido').style.color = saldo >= 0 ? '#22c55e' : '#ef4444';
        }

        // FUNÇÃO PARA APAGAR
        window.apagarRegistro = (id) => {
            if(confirm("Tem certeza que deseja apagar?")) {
                remove(ref(db, 'movimentacoes/' + id));
            }
        };
    </script>
</body>
</html>
