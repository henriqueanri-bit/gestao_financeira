<script type="module">
// ================= FIREBASE =================
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-app.js";
import { 
  getDatabase, ref, push, set, onValue, remove 
} from "https://www.gstatic.com/firebasejs/12.11.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyAEeOilHu6K2qvyB-49kyqx0K9dXAgW74c",
  authDomain: "gestaofinanceiracaixa.firebaseapp.com",
  databaseURL: "https://gestaofinanceiracaixa-default-rtdb.firebaseio.com",
  projectId: "gestaofinanceiracaixa",
  storageBucket: "gestaofinanceiracaixa.firebasestorage.app",
  messagingSenderId: "15986056077",
  appId: "1:15986056077:web:2f43cb7abd56fe69cc7bc4"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

// ================= ESTADO =================
let currentCompanyId = null;
let transactions = [];

// ================= EMPRESAS =================
const empresasRef = ref(db, "empresas");

function loadCompanies() {
  onValue(empresasRef, (snapshot) => {
    const select = document.getElementById('currentCompany');
    select.innerHTML = "";

    snapshot.forEach(child => {
      const opt = document.createElement('option');
      opt.value = child.key;
      opt.textContent = child.val().name;
      select.appendChild(opt);
    });

    if (!currentCompanyId && select.options.length > 0) {
      currentCompanyId = select.options[0].value;
      loadTransactions();
    }
  });
}

window.addCompany = function() {
  const name = prompt("Nome da empresa:");
  if (!name) return;

  const newRef = push(empresasRef);
  set(newRef, { name });

  currentCompanyId = newRef.key;
};

// troca empresa
document.getElementById("currentCompany").addEventListener("change", (e) => {
  currentCompanyId = e.target.value;
  loadTransactions();
});

// ================= TRANSAÇÕES =================
function transacoesRef() {
  return ref(db, "transacoes/" + currentCompanyId);
}

function loadTransactions() {
  if (!currentCompanyId) return;

  onValue(transacoesRef(), (snapshot) => {
    transactions = [];

    snapshot.forEach(child => {
      transactions.push({
        id: child.key,
        ...child.val()
      });
    });

    renderTransactions();
    updateSummary();
  });
}

// ================= SALVAR =================
document.getElementById('transactionForm').addEventListener('submit', e => {
  e.preventDefault();

  if (!currentCompanyId) {
    alert("Selecione uma empresa!");
    return;
  }

  const date = document.getElementById('date').value;
  const type = document.getElementById('type').value;
  const description = document.getElementById('description').value;
  const quantity = parseFloat(document.getElementById('quantity').value);
  const value = parseFloat(document.getElementById('value').value);

  const total = quantity * value;

  push(transacoesRef(), {
    date,
    type,
    description,
    quantity,
    value,
    totalAbs: total
  });

  document.getElementById('transactionForm').reset();
});

// ================= EXCLUIR =================
window.deleteTransaction = function(id) {
  remove(ref(db, "transacoes/" + currentCompanyId + "/" + id));
};

// ================= RENDER =================
function renderTransactions() {
  const tbody = document.getElementById('transactionsBody');
  tbody.innerHTML = "";

  if (transactions.length === 0) {
    tbody.innerHTML = '<tr><td colspan="9">Nenhuma transação</td></tr>';
    return;
  }

  transactions.forEach(t => {
    const tr = document.createElement('tr');

    tr.innerHTML = `
      <td>${t.date}</td>
      <td>${t.type}</td>
      <td>${t.description}</td>
      <td>${t.quantity}</td>
      <td>${t.value}</td>
      <td>${t.totalAbs}</td>
      <td>-</td>
      <td>-</td>
      <td>
        <button onclick="deleteTransaction('${t.id}')">Excluir</button>
      </td>
    `;

    tbody.appendChild(tr);
  });
}

// ================= RESUMO =================
function updateSummary() {
  let entrada = 0;
  let saida = 0;

  transactions.forEach(t => {
    if (t.type === "entrada") entrada += t.totalAbs;
    else saida += t.totalAbs;
  });

  document.getElementById('totalEntrada').textContent = "R$ " + entrada.toFixed(2);
  document.getElementById('totalSaida').textContent = "R$ " + saida.toFixed(2);
  document.getElementById('saldoLiquido').textContent = "R$ " + (entrada - saida).toFixed(2);
}

// INIT
loadCompanies();

</script>
